# SonarQube Cloud, run from CI (the "Unit Tests" job in ci.yml), not
# Automatic Analysis: only a CI scan can import coverage. The two are
# exclusive, so Automatic Analysis is off for this project.
sonar.projectKey=airdress-co_airdress-cli
sonar.organization=airdress-co

sonar.sources=.
sonar.exclusions=target/**,lcov.info

# Written by `cargo llvm-cov --lcov` in the same job.
sonar.rust.lcov.reportPaths=lcov.info

# The Rust analyzer runs clippy itself unless told not to (measured on
# Community Build 26.10, 2026-11-02: `sonar.rust.clippy.enabled` defaults to
# true). "Build & Lint" already runs clippy with -D warnings, so a second run
# would only rebuild the workspace for findings CI has refused already.
# SonarQube's own Rust rules still run.
sonar.rust.clippy.enabled=false
