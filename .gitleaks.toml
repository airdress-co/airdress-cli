# gitleaks configuration for the pre-publication audit.
#
# Every entry here is a finding somebody looked at and decided was not a
# secret, with the reason. An allowlist without a reason is how a real
# finding gets waved through, so a new entry needs one.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|password|auth)[a-z0-9_ .\-]{0,25}(?:=|>|:=|\|\|:|<=|=>|:).{0,5}['"]([0-9a-zA-Z\-_=]{16,64})['"]'''
keywords = ["key", "api", "token", "secret", "password", "auth"]

[rules.allowlist]
# The machine-enrollment test fixture. `b3BlcmF0b3Ita2V5LWJ5dGVz` is
# base64 for the ASCII text "operator-key-bytes": the test needs bytes
# that decode, and these say what they are.
#
# The canonicalization fixture in the device-bootstrap test. Both values
# are the bytes 0..31 and the byte 7 repeated, written out in base64url
# so the test can prove, byte for byte, that this crate and the operator
# canonicalize a delegation identically. A fixture whose inputs are
# "0, 1, 2, …" is the opposite of a secret.
regexes = [
    '''b3BlcmF0b3Ita2V5LWJ5dGVz''',
    '''AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8''',
    '''BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc''',
]
paths = [
    '''src/machine/mod\.rs''',
    '''src/device/bootstrap\.rs''',
]
