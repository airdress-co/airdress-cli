name: Linux portability
# A pull request that can change what the Linux release builds (the release
# workflow, its scripts, the packaging, or the dependency set) builds the
# static Linux binaries, .debs and .rpms exactly as release.yml does, and runs
# them on every distribution of the stated baseline (linux-smoke.yml).
# Single pass: the double build and byte compare stay on tags.
on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/linux-smoke.yml
      - .github/workflows/portability.yml
      - Cargo.lock
      - Cargo.toml
      - nfpm.yaml
      - nfpm-agent.yaml
      - scripts/release-build.sh
      - scripts/package-linux.sh
      - scripts/manifest-kind.sh
      - LICENSE
      - packaging/**
      - scripts/linux-smoke.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same targets and images as release.yml's Linux legs; change
          # them together.
          - target: x86_64-unknown-linux-musl
            image: "messense/rust-musl-cross@sha256:ce75e9174325d4fbb3de85c309e2d7ca29f7500169bc4b5d2c611ff7e86d549a"
            artifact: airdress-linux-amd64
            agent_artifact: airdress-agent-linux-amd64
            deb_arch: amd64
          - target: aarch64-unknown-linux-musl
            image: "messense/rust-musl-cross@sha256:ecae5dd62d1c938c14f8071d36c16fa699860aace03bfb5284fb1216474d2643"
            artifact: airdress-linux-arm64
            agent_artifact: airdress-agent-linux-arm64
            deb_arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: ./.github/actions/private-deps
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Build
        env:
          AIRDRESS_BUILD_VERSION: pr-${{ github.event.pull_request.number || 'dispatch' }}
          AIRDRESS_BUILD_COMMIT: ${{ github.sha }}
          AIRDRESS_BUILD_TARGET: ${{ matrix.target }}
          AIRDRESS_BUILD_IMAGE: ${{ matrix.image }}
        run: |
          scripts/release-build.sh ${{ matrix.target }}
          scripts/release-build.sh --agent ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/airdress ${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/airdress-agent ${{ matrix.agent_artifact }}
      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM_VERSION=2.41.3
          # Pinned from the release's checksums.txt and re-hashed locally.
          NFPM_SHA256=22aa6d3bc2ec239d62d3d190bcb036a47f2b24e0c3c6edfccebb6a55fbb2078e
          tarball="${RUNNER_TEMP}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$tarball" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$(basename "$tarball")"
          echo "${NFPM_SHA256}  ${tarball}" | sha256sum -c -
          sudo tar -xzf "$tarball" -C /usr/local/bin nfpm
      - name: Build .debs and .rpms
        run: |
          for fmt in deb rpm; do
            scripts/package-linux.sh "$fmt" nfpm.yaml ${{ matrix.artifact }} ${{ matrix.deb_arch }} v0.0.0 airdress
            scripts/package-linux.sh "$fmt" nfpm-agent.yaml ${{ matrix.agent_artifact }} ${{ matrix.deb_arch }} v0.0.0 airdress-agent
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.agent_artifact }}
          path: ${{ matrix.agent_artifact }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}-deb
          path: airdress_*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.agent_artifact }}-deb
          path: airdress-agent_*.deb
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}-rpm
          path: airdress-[0-9]*.rpm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.agent_artifact }}-rpm
          path: airdress-agent-[0-9]*.rpm

  smoke:
    name: Smoke
    needs: build
    uses: ./.github/workflows/linux-smoke.yml
    with:
      ref: ${{ github.sha }}
      version: pr-${{ github.event.pull_request.number || 'dispatch' }}
